name: Bug report
description: Report a reproducible DockLayout defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal component definition and exact steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: XLib.DockLayout version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and .NET SDK
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
