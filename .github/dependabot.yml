version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-runtime:
        patterns:
          - "Microsoft.AspNetCore.*"
      tests:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
          - "bunit*"
          - "coverlet*"
          - "Microsoft.Playwright*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
