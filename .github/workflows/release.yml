name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer-like version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore XLib.DockLayout.sln

      - name: Verify formatting
        run: dotnet format XLib.DockLayout.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build XLib.DockLayout.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test tests/XLib.DockLayout.Tests/XLib.DockLayout.Tests.csproj -c Release --no-build

      - name: Pack
        run: >-
          dotnet pack src/XLib.DockLayout/XLib.DockLayout.csproj
          -c Release --no-build
          -p:PackageVersion=${{ steps.version.outputs.value }}
          -o artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: XLib.DockLayout-${{ steps.version.outputs.value }}
          path: artifacts/packages/*.*nupkg

      - name: Push package to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "No .nupkg files were produced." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push symbols to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.snupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "No symbol package was produced; skipping symbol push."
            exit 0
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
